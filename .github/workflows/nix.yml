name: Nix

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flake-check:
    name: nix flake check
    strategy:
      fail-fast: false
      matrix:
        # Run `nix flake check` on every system the flake declares via
        # nix-systems/default. macOS runners are slower and scarcer than
        # linux, but catching aarch64-darwin / x86_64-darwin regressions
        # here is cheaper than discovering them after a release.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          # Pin nixpkgs to the same channel the flake uses for eval stability
          # on CI runners. The flake itself follows nixos-unstable.
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check that the flake evaluates
        run: nix flake check --no-build

  build:
    name: nix build .#default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # cachix-action is optional: without an authToken or if the cache
      # doesn't exist yet, continue-on-error lets the build proceed without
      # caching. Guard to the canonical repo so forks don't attempt uploads.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: github.repository == 'LarsArtmann/segment-buffer'
        continue-on-error: true
        with:
          name: larsartmann-segment-buffer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Build the default package
        run: nix build .#default --print-build-logs

  test:
    name: nix build .#checks.x86_64-linux.test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        if: github.repository == 'LarsArtmann/segment-buffer'
        continue-on-error: true
        with:
          name: larsartmann-segment-buffer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - name: Run the test check
        run: nix build .#checks.x86_64-linux.test --print-build-logs

  fmt:
    name: nix fmt (treefmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run treefmt in check mode
        run: nix fmt -- --fail-on-change
